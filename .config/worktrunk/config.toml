# Local-only setup for Partners Hub (do not commit environment files or Vercel links).
# Use the /merge skill for manually titled Conventional Commit squash merges;
# plain `wt merge` may generate a non-conventional fallback commit message.
[projects."github.com/forbesadvisor/mktp-cms-partners-hub"]
pre-start = '''
source_root={{ primary_worktree_path }}
for app in "$source_root"/apps/*; do
  [ -d "$app" ] || continue
  target="apps/${app##*/}"
  if [ -f "$app/.env.local" ] && [ ! -e "$target/.env.local" ]; then
    mkdir -p "$target"
    cp -p "$app/.env.local" "$target/.env.local"
  fi
  if [ -d "$app/.vercel" ] && [ ! -e "$target/.vercel" ] && [ ! -L "$target/.vercel" ]; then
    mkdir -p "$target"
    ln -s "$app/.vercel" "$target/.vercel"
  fi
done
'''
post-start = "pnpm install"
